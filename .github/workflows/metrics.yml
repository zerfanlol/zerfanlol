name: github-metrics

on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: terminal
          base: header, repositories
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 5
          config_timezone: Europe/Moscow
          extras_css: |
            /* Полностью убираем фиолетовый фон Ubuntu */
            .terminal, div.terminal, table.terminal, svg {
              background: #090a0f !important;
              background-color: #090a0f !important;
            }
            /* Фон всей карточки под цвет тёмной темы GitHub */
            :root {
              --color-background: #0d1117 !important;
              --color-terminal-bg: #090a0f !important;
              --color-terminal-header: #161b22 !important;
              --color-terminal-border: #30363d !important;
            }
            /* Убираем дисклеймер сверху */
            .disclaimer { display: none !important; }
